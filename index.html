<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答案时代 · 一场创始人与AI的深度对话（有声版）</title>
<style>
  :root {
    --green: #2e7d4f;
    --green-deep: #1e5f3c;
    --green-soft: #e8f3ec;
    --green-mist: #f4faf6;
    --ink: #1c2b24;
    --muted: #6b7f74;
    --line: #dcebe2;
    --gold: #b98a2f;
    --bg: #fbfdfc;
    --card: #ffffff;
    --shadow: 0 10px 40px rgba(30, 95, 60, .10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(46,125,79,.08), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(46,125,79,.06), transparent 55%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }

  /* 头部 */
  header { text-align: center; margin-bottom: 32px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 4px;
    color: var(--green); background: var(--green-soft);
    padding: 6px 18px; border-radius: 999px; margin-bottom: 20px;
    border: 1px solid rgba(46,125,79,.18);
  }
  h1 { font-size: 32px; font-weight: 800; letter-spacing: 1px; color: var(--green-deep); }
  .sub { color: var(--muted); margin-top: 10px; font-size: 14px; }
  .meta { margin-top: 8px; color: var(--muted); font-size: 13px; }
  .meta .sp { margin: 0 8px; color: var(--line); }

  /* 播放器 */
  .player {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 24px 28px; margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .play-row { display: flex; align-items: center; gap: 18px; }
  .btn-play {
    width: 60px; height: 60px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--green), var(--green-deep));
    border: none; cursor: pointer; color: #fff; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 20px rgba(46,125,79,.35);
  }
  .btn-play:hover { transform: scale(1.06); }
  .btn-play.playing { background: linear-gradient(135deg, #c7d8ce, #a9c4b5); color: var(--green-deep); }
  .progress-wrap { flex: 1; }
  .time-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none; height: 6px;
    border-radius: 3px; background: var(--line); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--green); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(46,125,79,.35); cursor: pointer;
  }
  .ctrl-row { display: flex; align-items: center; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
  .speed-label { font-size: 13px; color: var(--muted); }
  .speed-btn {
    background: var(--green-mist); border: 1px solid var(--line); color: var(--ink);
    font-size: 12px; padding: 5px 14px; border-radius: 999px; cursor: pointer;
    transition: all .15s; font-weight: 600;
  }
  .speed-btn:hover { border-color: var(--green); }
  .speed-btn.on { background: var(--green); border-color: var(--green); color: #fff; }
  .now-chapter {
    margin-left: auto; font-size: 13px; color: var(--green-deep); font-weight: 600;
    max-width: 340px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
    background: var(--green-soft); padding: 5px 14px; border-radius: 999px;
  }

  /* 章节卡片 */
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
    box-shadow: var(--shadow);
  }
  .panel-title {
    font-size: 14px; letter-spacing: 2px; color: var(--green-deep); font-weight: 700;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .panel-title::before { content: ""; width: 4px; height: 16px; background: var(--green); border-radius: 2px; }
  .chapter-list { padding: 10px; }
  .chapter-item {
    padding: 14px 16px; border-radius: 14px; cursor: pointer; font-size: 14px;
    color: var(--muted); transition: all .18s; display: flex; align-items: center; gap: 12px;
    margin-bottom: 2px;
  }
  .chapter-item:hover { background: var(--green-mist); color: var(--ink); }
  .chapter-item.active {
    background: var(--green-soft);
    color: var(--green-deep);
    box-shadow: inset 0 0 0 1px rgba(46,125,79,.2);
  }
  .chapter-item .no {
    font-size: 12px; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--green-mist); color: var(--green); font-weight: 700; flex-shrink: 0;
    font-family: monospace;
  }
  .chapter-item.active .no { background: var(--green); color: #fff; }
  .chapter-item .tt { flex: 1; }
  .chapter-item .tm { font-size: 12px; color: var(--muted); font-family: monospace; flex-shrink: 0; }
  .chapter-item.active .tm { color: var(--green-deep); }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 36px; line-height: 2; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">有声对谈录 · 网页版</div>
    <h1>答案时代</h1>
    <div class="sub">一场创始人与 AI 的深度对话</div>
    <div class="meta">AI 顾问式电商平台 · Meu Mall 商业逻辑全景对谈录<span class="sp">·</span>Alan × 卡卡<span class="sp">·</span>2026.09.01</div>
  </header>

  <div class="player">
    <div class="play-row">
      <button class="btn-play" id="btnPlay" aria-label="播放/暂停">&#9654;</button>
      <div class="progress-wrap">
        <div class="time-row"><span id="curTime">00:00:00</span><span id="totalTime">00:00:00</span></div>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      </div>
    </div>
    <div class="ctrl-row">
      <span class="speed-label">语速</span>
      <button class="speed-btn" data-speed="0.8">0.8x</button>
      <button class="speed-btn on" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="1.2">1.2x</button>
      <button class="speed-btn" data-speed="1.5">1.5x</button>
      <span class="now-chapter" id="nowChapter">—</span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">目录 · 11 个章节</div>
    <div class="chapter-list" id="chapterList"></div>
  </div>

  <footer>对话全文朗读 · 无旁白 · 语速偏快 / 气口紧凑</footer>
</div>

<audio id="audio" preload="metadata" src="https://yangguang-web.github.io/answer-era/assets/answer-era.mp3"></audio>

<script>
const DATA = {"chapters": [{"title": "序幕 · 相识", "start": 0.0, "start_idx": 0, "end": 85.62}, {"title": "第一部分 · 经营理念：AI 电商是一个独立的物种", "start": 85.62, "start_idx": 8, "end": 264.27}, {"title": "第二部分 · 灵魂三问：AI 电商的本质推演", "start": 264.27, "start_idx": 14, "end": 935.81}, {"title": "第三部分 · 平台设计：让人人可以有一个顾问", "start": 935.81, "start_idx": 32, "end": 2072.77}, {"title": "第四部分 · 难点二：供应链的封装", "start": 2072.77, "start_idx": 48, "end": 3165.7}, {"title": "第五部分 · 难点三：平台冷启动与三阶段战略", "start": 3165.7, "start_idx": 62, "end": 3714.98}, {"title": "第六部分 · 招商实战：已经打完的第一仗", "start": 3714.98, "start_idx": 76, "end": 3949.5}, {"title": "第七部分 · 前车之鉴：私域电商三巨头的生与死", "start": 3949.5, "start_idx": 80, "end": 5198.79}, {"title": "第八部分 · 第二阶段作战地图：把脚下的路走好", "start": 5198.79, "start_idx": 94, "end": 5799.04}, {"title": "第九部分 · 标准会客厅：把激活搬到线下", "start": 5799.04, "start_idx": 98, "end": 6164.26}, {"title": "尾声 · 一场对话的复盘", "start": 6164.26, "start_idx": 102, "end": 6280.51}], "total_dur": 6280.51};
const audio = document.getElementById('audio');
const btnPlay = document.getElementById('btnPlay');
const seek = document.getElementById('seek');
const curTimeEl = document.getElementById('curTime');
const totalTimeEl = document.getElementById('totalTime');
const nowChapter = document.getElementById('nowChapter');
const chapterList = document.getElementById('chapterList');

const chapters = DATA.chapters;

function fmt(t) {
  t = Math.floor(t || 0);
  const h = String(Math.floor(t/3600)).padStart(2,'0');
  const m = String(Math.floor(t%3600/60)).padStart(2,'0');
  const s = String(t%60).padStart(2,'0');
  return h + ':' + m + ':' + s;
}

// 渲染章节
chapters.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'chapter-item';
  el.dataset.idx = i;
  const title = c.title.replace(/^第[一二三四五六七八九十]+部分\s*[·．.]?\s*/, '');
  el.innerHTML = `<span class="no">${String(i+1).padStart(2,'0')}</span><span class="tt">${title}</span><span class="tm">${fmt(c.start)}</span>`;
  el.addEventListener('click', () => { audio.currentTime = c.start; if (audio.paused) audio.play(); });
  chapterList.appendChild(el);
});

const chEls = Array.from(chapterList.children);
let currentCh = -1;

function updateChapter() {
  const t = audio.currentTime;
  let ci = -1;
  for (let i = chapters.length - 1; i >= 0; i--) {
    if (t >= chapters[i].start) { ci = i; break; }
  }
  if (ci !== currentCh) {
    if (currentCh >= 0) chEls[currentCh].classList.remove('active');
    currentCh = ci;
    if (ci >= 0) {
      chEls[ci].classList.add('active');
      const raw = chapters[ci].title;
      nowChapter.textContent = '♪ ' + raw.replace(/^第[一二三四五六七八九十]+部分\s*[·．.]?\s*/, '');
      chEls[ci].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
}

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  seek.value = (audio.currentTime / audio.duration * 100).toFixed(2);
  curTimeEl.textContent = fmt(audio.currentTime);
  updateChapter();
});

audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = fmt(audio.duration);
});

seek.addEventListener('input', () => {
  if (audio.duration) audio.currentTime = seek.value / 100 * audio.duration;
});

btnPlay.addEventListener('click', () => {
  if (audio.paused) { audio.play(); } else { audio.pause(); }
});

audio.addEventListener('play', () => {
  btnPlay.classList.add('playing'); btnPlay.innerHTML = '&#10074;&#10074;';
});
audio.addEventListener('pause', () => {
  btnPlay.classList.remove('playing'); btnPlay.innerHTML = '&#9654;';
});

document.querySelectorAll('.speed-btn').forEach(b => {
  b.addEventListener('click', () => {
    audio.playbackRate = parseFloat(b.dataset.speed);
    document.querySelectorAll('.speed-btn').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  });
});

updateChapter();
</script>
</body>
</html>
